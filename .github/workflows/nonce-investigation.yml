
name: Auth0.js Nonce Investigation

on:
  workflow_dispatch:
  push:
    branches:
      - investigate/state-nonce-validation

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run focused Auth0.js tests
        run: npx cross-env BABEL_ENV=test npx mocha --require @babel/register --require jsdom-global/register test/web-auth/web-auth.test.js --exit
