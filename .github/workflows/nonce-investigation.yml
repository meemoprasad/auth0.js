
name: Auth0.js Nonce Investigation

on:
  workflow_dispatch:
  push:
    branches:
      - investigate/state-nonce-validation

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm ci

      - name: Run web-auth tests
        run: npx mocha test/web-auth/web-auth.test.js
